<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Info - LEDIUM</title>
    <style>
        /* Internal CSS - No external data required */
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            border: 2px solid #000;
            padding: 20px;
            border-radius: 8px;
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #000;
            margin-bottom: 20px;
            padding-bottom: 10px;
        }
        .brand-name {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .field-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #444;
        }
        .input-wrapper {
            display: flex;
            border: 1px solid #000;
            border-radius: 4px;
            overflow: hidden;
        }
        input {
            flex-grow: 1;
            border: none;
            padding: 10px;
            font-size: 14px;
            background: #fff;
            color: #000;
            outline: none;
        }
        .copy-btn {
            background: #000;
            color: #fff;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            min-width: 70px;
        }
        .copy-btn:active {
            background: #444;
        }
        .footer-note {
            text-align: center;
            font-size: 11px;
            margin-top: 20px;
            color: #777;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="brand-name">LEDIUM Clothing Brand Payment Details™</div>
    </div>

    <div class="field-group">
        <label>ACCOUNT HOLDER</label>
        <div class="input-wrapper">
            <input type="text" value="Ledium clothing brand" id="accHolder" readonly>
            <button class="copy-btn" onclick="copyText('accHolder', this)">COPY</button>
        </div>
    </div>

    <div class="field-group">
        <label>BANK NAME</label>
        <div class="input-wrapper">
            <input type="text" value="TymeBank" id="bankName" readonly>
            <button class="copy-btn" onclick="copyText('bankName', this)">COPY</button>
        </div>
    </div>

    <div class="field-group">
        <label>BRANCH CODE</label>
        <div class="input-wrapper">
            <input type="text" value="678910" id="branchCode" readonly>
            <button class="copy-btn" onclick="copyText('branchCode', this)">COPY</button>
        </div>
    </div>

    <div class="field-group">
        <label>ACCOUNT NUMBER</label>
        <div class="input-wrapper">
            <input type="text" value="53001990050" id="accNum" readonly>
            <button class="copy-btn" onclick="copyText('accNum', this)">COPY</button>
        </div>
    </div>

    <div class="footer-note">
        LEDIUM CLOTHING BRAND OFFICIAL PAYMENT DETAILS
    </div>
</div>

<script>
    function copyText(elementId, btn) {
        var copyText = document.getElementById(elementId);
        
        // Select and copy
        copyText.select();
        copyText.setSelectionRange(0, 99999); 
        
        try {
            navigator.clipboard.writeText(copyText.value);
        } catch (err) {
            // Fallback for older browsers
            document.execCommand("copy");
        }

        // Feedback
        const originalText = btn.innerHTML;
        btn.innerHTML = "DONE";
        btn.style.backgroundColor = "#28a745";
        
        setTimeout(() => {
            btn.innerHTML = originalText;
            btn.style.backgroundColor = "#000";
        }, 2000);
    }
</script>

</body>
</html>
