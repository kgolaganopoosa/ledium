<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Details | LEDIUM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .payment-card {
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 2rem;
            width: 100%;
            max-width: 450px;
        }
        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #000;
        }
        .form-label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #555;
        }
        .input-group-text {
            background-color: #000;
            color: #fff;
            cursor: pointer;
            transition: background-color 0.2s;
            border: none;
        }
        .input-group-text:hover {
            background-color: #333;
        }
        .input-group-text:active {
            background-color: #28a745;
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #ced4da;
        }
    </style>
</head>
<body>

<div class="payment-card">
    <h2 class="brand-header">LEDIUM CLOTHING BRAND™</h2>
    <p class="text-muted text-center mb-4">Use the buttons below to copy payment information.</p>

    <div class="mb-3">
        <label class="form-label">Account Holder</label>
        <div class="input-group">
            <input type="text" class="form-control" value="Ledium clothing brand" id="accHolder" readonly>
            <button class="input-group-text" onclick="copyText('accHolder')">Copy</button>
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">Bank Name</label>
        <div class="input-group">
            <input type="text" class="form-control" value="TymeBank" id="bankName" readonly>
            <button class="input-group-text" onclick="copyText('bankName')">Copy</button>
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">Branch Code</label>
        <div class="input-group">
            <input type="text" class="form-control" value="678910" id="branchCode" readonly>
            <button class="input-group-text" onclick="copyText('branchCode')">Copy</button>
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">Account Number</label>
        <div class="input-group">
            <input type="text" class="form-control" value="53001990050" id="accNum" readonly>
            <button class="input-group-text" onclick="copyText('accNum')">Copy</button>
        </div>
    </div>
    
    <div class="text-center mt-4">
        <small class="text-muted">Secure Payment Info</small>
    </div>
</div>

<script>
    function copyText(elementId) {
        var copyText = document.getElementById(elementId);
        copyText.select();
        copyText.setSelectionRange(0, 99999); // For mobile devices
        navigator.clipboard.writeText(copyText.value);
        
        // Optional: Visual feedback
        const btn = event.target;
        const originalText = btn.innerHTML;
        btn.innerHTML = "Copied!";
        setTimeout(() => {
            btn.innerHTML = originalText;
        }, 1500);
    }
</script>

</body>
</html>
